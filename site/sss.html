    <script type="application/ld+json" id="faq-schema"></script>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // FAQPage schema for SSS page
    (function(){
      var faqSchema = {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": SITE_CONTENT.faq.map(function(f){
          return {
            "@type": "Question",
            "name": f.question,
            "acceptedAnswer": {
              "@type": "Answer",
              "text": f.answer
            }
          };
        })
      };
      var el = document.getElementById("faq-schema");
      if(el) el.textContent = JSON.stringify(faqSchema);
    })();
  </script>
  <!-- Content'i assets/js/content.js'den değiştirin -->
